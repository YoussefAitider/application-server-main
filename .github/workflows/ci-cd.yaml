name: HTTP APP Workflow

on:
    push:
        branches: 
            - main
            - master
    pull_request: 
        branches: 
            - main
            - master

jobs:
    
    test_and_build:
        runs-on: ubuntu-latest

        steps:
            - name: clone code
              uses: actions/checkout@v5

            - name: Setup node js enviroment
              uses: actions/setup-node@v6  
              with:
                node-version: 24

            - name: Install node js packages
              run: npm install

         #   - name: run test
         #     run: npm run test
            
            - name: compile source code
              run: npm run build
